<style>

:root{color-scheme:light;--bg:#f2f2f7;--card:#fff;--glass:rgba(255,255,255,.82);--tx:#1c1c1e;--sub:#73737c;--pri:#007aff;--pri2:#5856d6;--ok:#248454;--warn:#ac6500;--bad:#d93642;--line:#e9e9ee;--sh:0 3px 14px rgba(28,28,30,.035);--g1:linear-gradient(0deg,#007aff,#71b9ff);--g2:linear-gradient(0deg,#ff7fa0,#ffb8cc)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
nav{position:sticky;top:20px;z-index:5;display:flex;gap:3px;width:calc(100% - 40px);max-width:520px;margin:28px auto 0;padding:4px;border:1px solid rgba(255,255,255,.75);border-radius:14px;background:rgba(226,227,233,.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 3px 14px #25253505}
nav button{flex:1;min-height:38px;padding:8px 5px;border:0;border-radius:10px;background:transparent;color:#63636d;font-size:14px;font-weight:500;cursor:pointer;transition:background .18s,color .18s,box-shadow .18s}
nav button.on{background:#fff;color:#1c1c1e;font-weight:600;box-shadow:0 2px 5px #00000012,0 0 1px #00000010}
nav button:not(.on):hover{background:#ffffff60;color:#1c1c1e}
main{max-width:960px;margin:0 auto;padding:28px 24px 56px}
.card{background:var(--card);border:1px solid #ffffff;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:var(--sh)}
.hero{position:relative;overflow:hidden;padding:36px;background:radial-gradient(ellipse at 100% 0,rgba(147,197,255,.18),transparent 65%),#fff}
.hero::after{content:"";position:absolute;width:170px;height:170px;right:38px;top:36px;border:22px solid #eaf3ff;border-top-color:#c5dfff;border-right-color:#96c5ff;border-radius:50%;transform:rotate(-30deg);pointer-events:none}
.hero>.lbl,.hero>.big{position:relative;z-index:1}
.hero .lbl:first-child{font-size:16px;font-weight:600;color:#51515b}
.big{font-size:40px;font-weight:650;letter-spacing:-.04em;line-height:1.2;font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-weight:400;letter-spacing:0;color:var(--sub);margin-left:5px}
.hero .big{font-size:76px;font-weight:700;margin:14px 0 16px;letter-spacing:-.055em}
.hero .big small{font-size:16px}
.hero .lbl:last-child{display:inline-block;padding:5px 11px;border-radius:8px;background:#f2f6fb;color:#6b7684;font-size:12px}
.hb.ok{color:var(--ok)}.hb.warn{color:var(--warn)}.hb.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:18px}.grid .card{margin-bottom:0}
.t1{background:linear-gradient(135deg,#fff 20%,#f0f6ff)}.t2{background:linear-gradient(135deg,#fff 20%,#effaf5)}.t3{background:linear-gradient(110deg,#fff 30%,#fff8ed)}
.grid .lbl{display:flex;align-items:center;gap:9px;margin-bottom:19px;font-size:14px;font-weight:600;color:#53535e}
.grid .lbl::before{content:"";width:10px;height:10px;border-radius:50%;background:#007aff;box-shadow:0 0 0 5px #eaf3ff;margin:0 5px}
.t2 .lbl::before{background:#34c759;box-shadow:0 0 0 5px #eaf9ee}
.t1 .big{color:#0879e8}.t2 .big{color:#248454}
.t3 h3{display:flex;align-items:center;gap:10px}
.t3 h3::before{content:"!";display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;background:#fff0d9;color:#ad6900;border-radius:8px;font-size:16px;font-weight:700}
.lbl{color:var(--sub);font-size:13px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.sub{color:var(--sub)}
h3{margin:0 0 16px;font-size:17px;font-weight:600;letter-spacing:-.02em}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;transition:filter .15s,background .15s,transform .15s}
button.b,button.g,button.r{border:0;border-radius:12px;min-height:44px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
button.b{background:#007aff;color:#fff;box-shadow:0 3px 8px #007aff15}
button.g{background:#eef5ff;color:#0069dc}
button.r{background:#fff0f0;color:#ce303c}
button.s{padding:6px 12px;min-height:34px;font-size:13px}
button:hover:not(:disabled){filter:brightness(.97)}button:active:not(:disabled){transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #007aff66;outline-offset:3px}
input,select,textarea{width:100%;min-height:44px;padding:11px 13px;border:1px solid #e6e6ec;border-radius:12px;background:#f8f8fa;color:var(--tx);font:inherit;accent-color:#007aff}
input:focus,select:focus,textarea:focus{background:#fff}
label{display:block;margin:16px 0 6px;font-size:13px;color:#63636d}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.item{display:flex;justify-content:space-between;gap:12px;padding:16px 8px 16px 14px;border-top:1px solid var(--line);border-left:3px solid transparent;flex-wrap:wrap}.item:first-child{border-top:0}
.item.st-valid{border-left-color:#8ddaa5}.item.st-used{border-left-color:#c7c7cc}.item.st-expired{border-left-color:#ffabb0}.item.st-warn{border-left-color:#ffd08b}
.item .lbl{margin-top:5px;line-height:1.75;overflow-wrap:anywhere}
.tag{display:inline-block;padding:3px 9px;border-radius:7px;font-size:12px;font-weight:500;background:color-mix(in srgb,currentColor 9%,transparent)}
table{width:100%;border-collapse:collapse}th,td{padding:12px 6px;text-align:right;border-top:1px solid var(--line)}th{color:var(--sub);font-size:13px;font-weight:500}th:first-child,td:first-child{text-align:left}
.bars{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:10px}.bg{flex:1;text-align:center;font-size:12px;color:var(--sub)}.pair{display:flex;gap:5px;align-items:flex-end;height:130px;justify-content:center}.pair i{width:40%;max-width:24px;border-radius:6px 6px 0 0;display:block;min-height:2px}
.mask{position:fixed;inset:0;background:rgba(28,28,30,.23);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border:1px solid #ffffff90;border-radius:28px;padding:28px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 24px 80px #0000001f}
#psearch{display:flex;align-items:center;gap:14px;max-width:960px;margin:22px auto 0;padding:0 24px}
#psearch input{flex:1;max-width:340px;min-height:44px;padding:10px 14px 10px 42px;border:1px solid #fff;border-radius:14px;box-shadow:var(--sh);background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' fill='none' stroke='%2373737c' stroke-width='2' stroke-linecap='round'><circle cx='8' cy='8' r='6'/><path d='M13 13l4 4'/></svg>") no-repeat 15px center}
#psearch input:focus{border-color:#007aff}
#pbar{display:flex;gap:12px;overflow-x:auto;max-width:960px;margin:12px auto 0;padding:4px 24px 8px;scrollbar-width:none}#pbar::-webkit-scrollbar{display:none}
.pc{flex:0 0 auto;display:grid;gap:3px;justify-items:start;align-content:start;min-width:116px;padding:13px 17px;border:1.5px solid #fff;border-radius:20px;background:#fff;box-shadow:var(--sh);cursor:pointer;text-align:left;color:var(--tx);font-size:13px}
.pc.on{border-color:#007aff;background:linear-gradient(135deg,#fff 35%,#eaf3ff)}
.pc .pn{font-weight:600;font-size:14px}
.pc .pv{font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums}.pc .pv small{margin-left:2px;font-size:12px;font-weight:500;letter-spacing:0;color:var(--sub)}
.pc .px{margin-top:3px;padding:2px 8px;border-radius:7px;background:#fff0d9;color:#ad6900;font-size:12px;font-weight:600}
.pc.add{align-self:stretch;justify-items:center;align-content:center;min-width:100px;background:transparent;border:1.5px dashed #c7c7cc;box-shadow:none;color:#63636d;font-weight:500}
@media(max-width:600px){#psearch{padding:0 16px;margin-top:16px}#psearch input{max-width:none}#pbar{padding:4px 16px 8px;margin-top:10px}nav{top:12px;margin-top:16px;width:calc(100% - 32px)}nav button{min-height:38px;font-size:13px}main{padding:20px 16px 36px}.card{padding:22px;border-radius:22px}.hero{padding:28px 24px}.hero::after{width:108px;height:108px;right:-25px;top:25px;border-width:15px;opacity:.65}.hero .big{font-size:64px}.hero .big small{font-size:14px}.grid{gap:14px;grid-template-columns:1fr 1fr}.grid .card{padding:20px 16px}.grid .big{font-size:34px}.grid .big small{display:block;font-size:12px;margin:5px 0 0}.grid .lbl{font-size:13px;gap:6px}.grid .lbl::before{width:8px;height:8px;margin:0 4px}.mask{align-items:flex-end;padding:0}.modal{max-height:90dvh;border-radius:28px 28px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom))}.modal::before{content:"";display:block;width:36px;height:5px;border-radius:999px;background:#d1d1d6;margin:-12px auto 22px}th,td{padding:10px 3px;font-size:12px}input,select,textarea{font-size:16px}}
@media(max-width:340px){.grid{grid-template-columns:1fr}.hero .big{font-size:54px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav id="nav"><button class="on" onclick="tab='ov';render()">概览</button><button class="" onclick="tab='tk';render()">加班单</button><button class="" onclick="tab='lv';render()">调休</button><button class="" onclick="tab='st';render()">统计</button><button class="" onclick="tab='se';render()">设置</button></nav>
<div id="psearch"><input id="pq" type="search" placeholder="搜索姓名，回车直接切换" autocomplete="off" aria-label="搜索人员姓名" oninput="pq=this.value;$('pbar').innerHTML=pbar()" onkeydown="if(event.key==='Enter')pPick()"><span id="pcnt" class="lbl">匹配 1 / 33 人</span></div>
<div id="pbar"><button class="pc on" onclick="setP(4)" title="许腾飞：剩余可调休 2.25 天"><span class="pn">许腾飞</span><span class="pv ok">2.25<small>天</small></span></button><button class="pc add" onclick="pForm()">＋ 添加人员</button></div>
<main id="app"><div class="card hero"><div class="lbl">许腾飞 · 当前可调休余额</div><div class="big"><span class="hb ok">2.25</span><small> 天（18 小时）</small></div><div class="row" style="margin-top:6px"><button class="g s" onclick="calForm()">校准余额</button><div class="lbl">来自 4 张有效加班单</div></div></div>
  <div class="grid"><div class="card t1"><div class="lbl">本月加班</div><div class="big">0<small> 天（0h）</small></div></div>
  <div class="card t2"><div class="lbl">本月调休</div><div class="big">2<small> 天（16h）</small></div></div></div>
  <div class="card t3"><h3>30 天内到期提醒</h3><div class="sub">没有即将到期的加班单</div></div></main>
<div id="modal"></div>
<script>
/* ========== 基础：1 单位 = 0.25 天 = 2 小时，全部用整数单位存储，避免浮点误差 ========== */
const $=id=>document.getElementById(id);
const TYPES={workday:'工作日',restday:'休息日',holiday:'节假日'};
const KEY='otm_v1';
const DEF={coef:{global:1,workday:1,restday:1,holiday:1},validityMonths:3,cutoffDate:'2026-06-01',cutoffExpire:'2026-12-31',step:0.25,cloud:{token:'',gistId:'',auto:true,rev:0},apiKey:'',model:'qwen-vl-max',endpoint:'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions'};
let S=load(),tab='ov',pq='';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.tickets)return fix({tickets:d.tickets,leaves:d.leaves||[],people:d.people,cur:d.cur,seedVer:d.seedVer,settings:migrate(d.settings)})}catch(e){}return fix({tickets:[],leaves:[],settings:JSON.parse(JSON.stringify(DEF))})}
/* 人员迁移：旧数据没有 person 字段，统一归到「我」；人员列表 = 已有人员 + 数据中出现过的人员 */
function fix(o){const DP='我';o.tickets.forEach(t=>{if(!t.person)t.person=DP});o.leaves.forEach(l=>{if(!l.person)l.person=DP});
  const ps=[...(o.people||[])];[...o.tickets,...o.leaves].forEach(x=>{if(!ps.includes(x.person))ps.push(x.person)});
  if(!ps.length)ps.push(DP);o.people=ps;if(!ps.includes(o.cur))o.cur=ps[0];return o}
function migrate(o){o=o||{};const st={...DEF,...o,coef:{...DEF.coef,...o.coef},cloud:{...DEF.cloud,...o.cloud}};if(!('cutoffDate' in o)){st.cutoffDate=DEF.cutoffDate;st.cutoffExpire=DEF.cutoffExpire;st.validityMonths=DEF.validityMonths}return st}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('保存失败：浏览器存储不可用')}}
function save(){persist();cloudSched()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d1=n=>String(Math.round(n*100)/100);
/* 展示：X天（Yh） */
const fmt=u=>`${d1(u/4)}天（${d1(u*2)}h）`;
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const ym=s=>s.slice(0,7);
const stepU=()=>Math.max(1,Math.round(S.settings.step*4));
/* 到期日 = 加班日期 + 有效月数 */
function expiry(t){const s=S.settings;if(s.cutoffDate&&s.cutoffExpire&&t.date<s.cutoffDate)return s.cutoffExpire;const d=new Date(t.date+'T00:00:00');d.setMonth(d.getMonth()+Number(S.settings.validityMonths));return ymd(d)}
const daysLeft=t=>Math.ceil((new Date(expiry(t)+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const rem=t=>Math.round((t.quotaU-t.usedU)*1e6)/1e6;
function status(t){if(!t.waive&&daysLeft(t)<0)return'expired';return rem(t)<=0?'used':'valid'}
const usable=t=>status(t)==='valid';
const balance=(p=S.cur)=>S.tickets.filter(t=>t.person===p&&usable(t)).reduce((a,t)=>a+rem(t),0);
const myT=()=>S.tickets.filter(t=>t.person===S.cur),myL=()=>S.leaves.filter(l=>l.person===S.cur);
/* 即将过期：30 天内到期、未豁免、仍可使用的加班单 */
const soonOf=p=>S.tickets.filter(t=>t.person===p&&usable(t)&&!t.waive&&daysLeft(t)<=30);
const stTag=t=>{const s=status(t);return s==='expired'?'<span class="tag bad">已过期</span>':s==='used'?'<span class="tag sub">已用完</span>':'<span class="tag ok">有效</span>'+(t.waive?' <span class="tag warn">已豁免</span>':'')};
const remCls=t=>status(t)==='expired'?'bad':rem(t)>=8?'ok':'warn';
const srcName=s=>({screenshot:'截图识别',excel:'Excel导入',adjust:'手动校准'}[s]||'手动');
const calcQuota=(u,type)=>Math.round(u*S.settings.coef.global*S.settings.coef[type]);

/* ========== 导航与渲染 ========== */
const TABS=[['ov','概览'],['tk','加班单'],['lv','调休'],['st','统计'],['se','设置']];
function render(){
  $('nav').innerHTML=TABS.map(([k,n])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('');
  $('pbar').innerHTML=pbar();
  $('app').innerHTML={ov:vOv,tk:vTk,lv:vLv,st:vSt,se:vSe}[tab]();
}
/* 人员栏：每人一张卡，显示剩余调休天数；有即将过期的额度时标注「即将过期 X天」 */
function pbar(){
  const ql=pq.trim().toLowerCase(),hit=S.people.map((p,i)=>[p,i]).filter(([p])=>!ql||p.toLowerCase().includes(ql));
  $('pcnt').textContent=ql?`匹配 ${hit.length} / ${S.people.length} 人`:`共 ${S.people.length} 人`;
  return (ql&&!hit.length?'<div class="sub" style="align-self:center;padding:0 6px">没有匹配的人员</div>':'')+hit.map(([p,i])=>{
    const b=balance(p),sn=soonOf(p),su=sn.reduce((a,t)=>a+rem(t),0),dl=sn.length?Math.min(...sn.map(daysLeft)):0;
    return `<button class="pc ${p===S.cur?'on':''}" onclick="setP(${i})" title="${esc(p)}：剩余可调休 ${d1(b/4)} 天"><span class="pn">${esc(p)}</span><span class="pv ${b>=8?'ok':b>0?'warn':'sub'}">${d1(b/4)}<small>天</small></span>${su?`<span class="px" title="最早 ${dl} 天后到期">即将过期 ${d1(su/4)}天</span>`:''}</button>`}).join('')
    +`<button class="pc add" onclick="pForm()">＋ 添加人员</button>`;
}
function setP(i){S.cur=S.people[i];save();render();const c=document.querySelector('.pc.on');if(c&&c.scrollIntoView)c.scrollIntoView({inline:'center',block:'nearest'})}
/* 回车：切换到第一个匹配的人员 */
function pPick(){const ql=pq.trim().toLowerCase(),i=S.people.findIndex(p=>!ql||p.toLowerCase().includes(ql));if(i>=0)setP(i)}
function vOv(){
  const m=ym(today());
  const ot=myT().filter(t=>ym(t.date)===m).reduce((a,t)=>a+t.u,0);
  const lv=myL().filter(l=>ym(l.date)===m).reduce((a,l)=>a+l.u,0);
  const soon=soonOf(S.cur).sort((a,b)=>daysLeft(a)-daysLeft(b));
  const b=balance();
  return`<div class="card hero"><div class="lbl">${esc(S.cur)} · 当前可调休余额</div><div class="big"><span class="hb ${b>=8?'ok':b>0?'warn':'bad'}">${d1(b/4)}</span><small> 天（${d1(b*2)} 小时）</small></div><div class="row" style="margin-top:6px"><button class="g s" onclick="calForm()">校准余额</button><div class="lbl">来自 ${myT().filter(usable).length} 张有效加班单</div></div></div>
  <div class="grid"><div class="card t1"><div class="lbl">本月加班</div><div class="big">${d1(ot/4)}<small> 天（${d1(ot*2)}h）</small></div></div>
  <div class="card t2"><div class="lbl">本月调休</div><div class="big">${d1(lv/4)}<small> 天（${d1(lv*2)}h）</small></div></div></div>
  <div class="card t3"><h3>30 天内到期提醒</h3>${soon.length?soon.map(t=>`<div class="item st-warn"><span>${t.date} ${TYPES[t.type]}</span><span class="warn">剩 ${fmt(rem(t))}，${daysLeft(t)} 天后到期（${expiry(t)}）</span></div>`).join(''):'<div class="sub">没有即将到期的加班单</div>'}</div>`;
}
function vTk(){
  const list=[...myT()].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  return`<div class="card row"><button class="b" onclick="tkForm()">新增加班单</button><button class="g" onclick="$('shot').click()">截图识别新增</button><input type="file" id="shot" accept="image/*" hidden onchange="shotPick(this)"></div>
  <div class="card">${list.length?list.map(t=>`<div class="item st-${status(t)}"><div><b>${t.date}</b> ${TYPES[t.type]} ${stTag(t)}<div class="lbl">时长 ${fmt(t.u)} × 系数 ${d1(t.coef)}${t.extraU?' ＋额外 '+fmt(t.extraU):''} → 额度 ${fmt(t.quotaU)}｜已调休 ${fmt(t.usedU)}｜到期 ${expiry(t)}｜${srcName(t.source)}${t.remark?'｜'+esc(t.remark):''}</div></div>
  <div style="text-align:right"><div class="${remCls(t)}" style="font-size:20px;font-weight:700">剩 ${d1(rem(t)/4)}天</div><div class="lbl">${d1(rem(t)*2)}h</div>
  <div class="row" style="justify-content:flex-end;margin-top:4px">${status(t)==='expired'&&!t.waive?`<button class="g s" onclick="waive('${t.id}')">豁免</button>`:''}${t.source==='adjust'?'':`<button class="g s" onclick="tkForm('${t.id}')">编辑</button>`}<button class="r s" onclick="tkDel('${t.id}')">删除</button></div></div></div>`).join(''):'<div class="sub">还没有加班单，点上方按钮新增</div>'}</div>`;
}
function vLv(){
  const list=[...myL()].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  return`<div class="card"><button class="b" onclick="lvForm()">发起调休</button> <button class="g" onclick="calForm()">校准余额</button> <span class="lbl">可用余额 ${fmt(balance())}</span></div>

/* ========== 弹窗 ========== */
const openM=h=>$('modal').innerHTML=`<div class="mask" onclick="if(event.target===this)closeM()"><div class="modal">${h}</div></div>`;
const closeM=()=>$('modal').innerHTML='';

/* ========== 加班单 ========== */
function tkForm(id,draft){
  const t=id?S.tickets.find(x=>x.id===id):(draft||{date:today(),type:'workday',u:4,remark:'',source:'manual'});
  window._tk={id,source:t.source||'manual'};
  openM(`<h3>${id?'编辑':'新增'}加班单${draft?'（识别草稿，请核对）':''}</h3>
  <label>日期</label><input type="date" id="t_d" value="${t.date}">
  <label>加班类型</label><select id="t_t">${Object.keys(TYPES).map(k=>`<option value="${k}" ${k===t.type?'selected':''}>${TYPES[k]}</option>`).join('')}</select>
  <label>时长</label><select id="t_u">${[1,2,3,4].map(u=>`<option value="${u}" ${u===t.u?'selected':''}>${u/4} 天（${u*2}h）</option>`).join('')}</select>
  <label>额外额度（天，可空）</label><input type="number" id="t_x" step="0.25" min="0" value="${(t.extraU||0)/4}"><label>备注</label><input id="t_r" value="${esc(t.remark)}">
  <div class="row" style="margin-top:14px"><button class="b" onclick="tkSave()">保存</button><button class="g" onclick="closeM()">取消</button></div>`);
}
function tkSave(){
  const date=$('t_d').value,type=$('t_t').value,u=+$('t_u').value,remark=$('t_r').value.trim();
  if(!date)return alert('请选择日期');
  const ex=Math.round((+$('t_x').value||0)*4),q=calcQuota(u,type)+ex,coef=S.settings.coef.global*S.settings.coef[type];
  if(_tk.id){
    const t=S.tickets.find(x=>x.id===_tk.id);
    if(q<t.usedU)return alert('新额度小于已调休额度，请先撤销相关调休');
    Object.assign(t,{date,type,u,coef,extraU:ex,quotaU:q,remark});
  }else S.tickets.push({id:uid(),person:S.cur,date,type,u,coef,extraU:ex,quotaU:q,usedU:0,remark,source:_tk.source,waive:false,createdAt:Date.now()});
  save();closeM();render();
}
function tkDel(id){
  const t=S.tickets.find(x=>x.id===id);
  if(t.usedU>0&&!confirm('该加班单已有调休记录，删除后相关调休记录中对应的扣减也会被移除。确定删除？'))return;
  if(t.usedU===0&&!confirm('确定删除这张加班单？'))return;
  S.leaves.forEach(l=>{const a=l.alloc.filter(x=>x.tid===id).reduce((s,x)=>s+x.u,0);l.alloc=l.alloc.filter(x=>x.tid!==id);l.u-=a});
  S.leaves=S.leaves.filter(l=>l.u>0);
  S.tickets=S.tickets.filter(x=>x.id!==id);save();render();
}
function waive(id){if(confirm('豁免后该单据不再过期，可继续用于调休。确定？')){S.tickets.find(x=>x.id===id).waive=true;save();render()}}

/* ========== 截图识别 ========== */
async function shotPick(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const s=S.settings;
  if(!s.apiKey){alert('未配置 API Key，请到「设置」填写，或使用手动新增');return}
  openM('<div>识别中，请稍候…</div>');
  try{
    const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
    const res=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages:[{role:'user',content:[{type:'image_url',image_url:{url}},{type:'text',text:'这是企业微信加班记录截图。提取加班日期、加班总时长（小时）、类型（工作日=workday，休息日=restday，节假日=holiday）。只返回JSON：{"date":"YYYY-MM-DD","hours":数字,"type":"workday|restday|holiday"}'}]}]})});
    const j=await res.json();
    const r=JSON.parse(j.choices[0].message.content.match(/\{[\s\S]*\}/)[0]);
    const u=Math.min(4,Math.max(1,Math.round(r.hours/2)));
    tkForm(null,{date:/^\d{4}-\d\d-\d\d$/.test(r.date)?r.date:today(),type:TYPES[r.type]?r.type:'workday',u,remark:'截图识别',source:'screenshot'});
  }catch(e){closeM();alert('识别失败：'+e.message+'\n请检查 Key、模型名、接口地址（需允许浏览器跨域），或手动录入')}
}

/* ========== 调休 ========== */
function lvForm(){
  const av=myT().filter(usable).sort((a,b)=>a.date.localeCompare(b.date));
  if(!av.length)return alert('没有可用的加班单');
  window._av=av;
  openM(`<h3>发起调休</h3><label>调休日期</label><input type="date" id="l_d" value="${today()}">
  <label>调休时长（天，≥0.5，步长 ${S.settings.step}）</label><input type="number" id="l_u" min="0.5" step="${S.settings.step}" value="0.5">
  <label>备注</label><input id="l_r">
  <label>扣减方式</label><select id="l_m" onchange="$('l_man').style.display=this.value==='m'?'block':'none'"><option value="f">先进先出（自动）</option><option value="m">手动选择加班单</option></select>
  <div id="l_man" style="display:none">${av.map(t=>`<div class="item"><span>${t.date} ${TYPES[t.type]}<div class="lbl">剩 ${fmt(rem(t))}</div></span><input type="number" style="width:90px" min="0" max="${rem(t)/4}" step="${S.settings.step}" data-tid="${t.id}" placeholder="扣几天"></div>`).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="b" onclick="lvSave()">提交</button><button class="g" onclick="closeM()">取消</button></div>`);
}
function lvSave(){
  const date=$('l_d').value,u=Math.round(+$('l_u').value*4),sp=stepU();
  if(!date)return alert('请选择日期');
  if(u<2)return alert('单次调休最少 0.5 天');
  if(u%sp)return alert('调休时长需为步长 '+S.settings.step+' 天的整数倍');
  if(u>balance())return alert('剩余额度不足，当前可用 '+fmt(balance()));
  let alloc=[];
  if($('l_m').value==='f'){
    let need=u;
    for(const t of _av){if(need<=0)break;const a=Math.min(need,rem(t));alloc.push({tid:t.id,u:a});need-=a}
  }else{
    document.querySelectorAll('#l_man input').forEach(i=>{const a=Math.round((+i.value||0)*4);if(a>0)alloc.push({tid:i.dataset.tid,u:a})});
    const sum=alloc.reduce((s,x)=>s+x.u,0);
    if(sum!==u)return alert(`手动分配合计 ${fmt(sum)}，需等于调休时长 ${fmt(u)}`);
    for(const a of alloc){const t=S.tickets.find(x=>x.id===a.tid);if(a.u>rem(t))return alert(t.date+' 的加班单额度不足')}
  }
  alloc.forEach(a=>S.tickets.find(x=>x.id===a.tid).usedU+=a.u);
  S.leaves.push({id:uid(),person:S.cur,date,u,alloc,remark:$('l_r').value.trim(),createdAt:Date.now()});
  save();closeM();render();
}
function lvUndo(id){
  if(!confirm('撤销该调休并返还额度？'))return;
  const l=S.leaves.find(x=>x.id===id);
  l.alloc.forEach(a=>{const t=S.tickets.find(x=>x.id===a.tid);if(t)t.usedU=Math.max(0,t.usedU-a.u)});
  S.leaves=S.leaves.filter(x=>x.id!==id);save();render();
}

/* ========== 设置 / 导出 / 备份 ========== */
function saveSet(){
  const s=S.settings,n=id=>+$(id).value;
  const step=n('c_s');
  if(!(step>0)||Math.round(step*4)!==step*4)return alert('步长必须是 0.25 的整数倍');
  s.coef={global:n('c_g'),workday:n('c_w'),restday:n('c_r'),holiday:n('c_h')};
  s.validityMonths=Math.max(1,Math.round(n('c_v')));s.cutoffDate=$('c_cd').value;s.cutoffExpire=$('c_ce').value;if(s.cutoffDate&&!s.cutoffExpire)return alert('请填写统一到期日');s.step=step;
  s.apiKey=$('a_k').value.trim();s.model=$('a_m').value.trim();s.endpoint=$('a_e').value.trim();
  save();alert('已保存。新规则只对之后新增的加班单生效，已有单据的系数不变。');render();
}
function exportXlsx(){
  if(typeof XLSX==='undefined')return alert('Excel 组件未加载，请检查网络');
  const wb=XLSX.utils.book_new(),dd=u=>u/4,sum=a=>a.reduce((s,x)=>s+x,0),add=(rows,n)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),n);
  add(S.tickets.map(t=>({人员:t.person,日期:t.date,类型:TYPES[t.type],加班天数:dd(t.u),系数:t.coef,额外额度:dd(t.extraU||0),可调休额度:dd(t.quotaU),已调休:dd(t.usedU),剩余:dd(rem(t)),是否已休:rem(t)<=0?'已休':'未休',到期日:expiry(t),状态:{valid:'有效',used:'已用完',expired:'已过期'}[status(t)],来源:srcName(t.source),备注:t.remark})),'加班单');
  add(S.leaves.map(l=>({人员:l.person,日期:l.date,调休天数:dd(l.u),扣减明细:l.alloc.map(a=>{const t=S.tickets.find(x=>x.id===a.tid);return(t?t.date:'已删除')+':'+dd(a.u)+'天'}).join('；'),备注:l.remark})),'调休记录');
  add(S.people.map(p=>{const tk=S.tickets.filter(t=>t.person===p),lv=S.leaves.filter(l=>l.person===p);return{人员:p,当前可调休余额天:dd(balance(p)),即将过期天:dd(sum(soonOf(p).map(rem))),加班单数:tk.length,调休次数:lv.length,累计加班额度:dd(sum(tk.map(t=>t.quotaU))),累计调休:dd(sum(lv.map(l=>l.u)))}}),'汇总');
  XLSX.writeFile(wb,`加班调休_${today()}.xlsx`);
}
function exportJson(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,settings:{...S.settings,apiKey:'',cloud:{...S.settings.cloud,token:''}}},null,1)],{type:'application/json'}));
  a.download=`加班调休备份_${today()}.json`;a.click();
}
function importJson(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);if(!Array.isArray(d.tickets)||!Array.isArray(d.leaves))throw 0;
    if(!confirm('恢复将覆盖当前所有数据，确定？'))return;
    localStorage.setItem(KEY,JSON.stringify(d));S=load();save();render();
  }catch(e){alert('文件格式不正确')}};
  r.readAsText(f);
}
function clearAll(){
  if(!confirm('将清空所有加班单、调休记录和设置，无法恢复。确定？'))return;
  if(prompt('请输入「清空」确认')!=='清空')return;
  localStorage.removeItem(KEY);S=load();render();
}

  const al=lvGet(),sum=al.reduce((s,a)=>s+a.u,0),l=S.leaves.find(x=>x.id===_le.id),d=$('e_d').value;
  if(!d)return alert('请选择日期');if(sum<1)return alert('请至少分配 0.25 天');
  for(const a of al){const t=S.tickets.find(x=>x.id===a.tid);if(a.u>rem(t)+(_le.cur[a.tid]||0)+1e-6)return alert(t.date+' 的加班单额度不足')}
  l.alloc.forEach(a=>{const t=S.tickets.find(x=>x.id===a.tid);if(t)t.usedU=Math.max(0,t.usedU-a.u)});
  al.forEach(a=>S.tickets.find(x=>x.id===a.tid).usedU+=a.u);
  Object.assign(l,{date:d,remark:$('e_r').value.trim(),u:sum,alloc:al});save();closeM();render();
}

/* ========== 云同步（GitHub 私有 Gist；本机仍是主存储，云端用于备份与换设备） ========== */
let cloudMsg='',_ct;
const cl=()=>S.settings.cloud;
const setMsg=m=>{cloudMsg=m;const e=$('c_msg');if(e)e.textContent=m};
const gh=(path,opt={})=>fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+cl().token,'Content-Type':'application/json'}}).then(r=>{if(!r.ok)throw new Error(r.status===401?'Token 无效':r.status===404?'找不到该 Gist':'HTTP '+r.status);return r.json()});
const payload=()=>{const{apiKey,model,endpoint,cloud,...rule}=S.settings;return{tickets:S.tickets,leaves:S.leaves,people:S.people,cur:S.cur,seedVer:S.seedVer,settings:rule}};
async function cloudGet(){const g=await gh('/gists/'+cl().gistId),f=g.files['overtime-data.json'];if(!f)throw new Error('Gist 中没有 overtime-data.json');return JSON.parse(f.truncated?await(await fetch(f.raw_url)).text():f.content)}
function cloudSched(){clearTimeout(_ct);const c=S.settings.cloud;if(c&&c.auto&&c.token)_ct=setTimeout(()=>cloudPush(),3000)}
async function cloudPush(force){
  const c=cl();if(!c.token)return;
  try{
    setMsg('同步中…');
    if(c.gistId&&!force){const d=await cloudGet();if((d.rev||0)>(c.rev||0))return setMsg('⚠ 云端有更新（可能来自其他设备），已暂停上传。请先「从云端拉取」，或确认以本机为准后点「强制上传」')}
    const rev=Date.now(),isNew=!c.gistId,body=JSON.stringify({description:'加班调休数据',public:false,files:{'overtime-data.json':{content:JSON.stringify({rev,...payload()})}}});
    const g=await gh(isNew?'/gists':'/gists/'+c.gistId,{method:isNew?'POST':'PATCH',body});
    c.gistId=g.id;c.rev=rev;persist();if(isNew&&tab==='se')render();setMsg('已同步 '+new Date().toLocaleTimeString());
  }catch(e){setMsg('同步失败：'+e.message)}
}
function cloudSave(){const c=cl();c.token=$('g_t').value.trim();c.gistId=$('g_i').value.trim();c.auto=$('g_a').checked;persist();if(!c.token)return alert('请填写 GitHub Token');cloudPush()}
async function cloudPull(){
  const c=cl();if(!c.token||!c.gistId)return alert('请先填写 Token 和 Gist ID，并点「保存并上传」或手动保存');
  try{
    setMsg('拉取中…');const d=await cloudGet();if(!Array.isArray(d.tickets))throw new Error('云端数据格式不正确');
    if(!confirm('用云端数据覆盖本机数据？\n云端更新时间：'+new Date(d.rev||0).toLocaleString()))return setMsg('已取消');
    const keep={...c,rev:d.rev||0},api={apiKey:S.settings.apiKey,model:S.settings.model,endpoint:S.settings.endpoint};
    S=fix({...d,settings:migrate({...d.settings,...api,cloud:keep})});persist();render();setMsg('已从云端恢复');
  }catch(e){setMsg('拉取失败：'+e.message)}
}

/* ========== 人员管理 ========== */
function pForm(){openM(`<h3>添加人员</h3><label>姓名</label><input id="p_n" maxlength="20"><div class="row" style="margin-top:16px"><button class="b" onclick="pAdd()">添加</button><button class="g" onclick="closeM()">取消</button></div>`);setTimeout(()=>$('p_n')&&$('p_n').focus(),0)}
function pAdd(){const n=$('p_n').value.trim();if(!n)return alert('请输入姓名');if(S.people.includes(n))return alert('该人员已存在');S.people.push(n);S.cur=n;save();closeM();tab='ov';render()}
function pRename(i){const o=S.people[i],n=(prompt('新的姓名',o)||'').trim();if(!n||n===o)return;if(S.people.includes(n))return alert('该人员已存在');
  S.tickets.forEach(t=>{if(t.person===o)t.person=n});S.leaves.forEach(l=>{if(l.person===o)l.person=n});S.people[i]=n;if(S.cur===o)S.cur=n;save();render()}
function pDel(i){const p=S.people[i];if(S.people.length<2)return alert('至少保留一位人员');
  const nt=S.tickets.filter(t=>t.person===p).length,nl=S.leaves.filter(l=>l.person===p).length;
  if(!confirm(`删除「${p}」及其 ${nt} 张加班单、${nl} 条调休记录？此操作无法恢复。`))return;
  S.tickets=S.tickets.filter(t=>t.person!==p);S.leaves=S.leaves.filter(l=>l.person!==p);S.people.splice(i,1);if(S.cur===p)S.cur=S.people[0];save();render()}

/* ========== 导入原 Excel（团队登记表 → 个人数据） ========== */
/* 日期统一转成 YYYY-MM-DD：Excel 序列号 / Date / 文本都支持（用 UTC 计算，避免时区偏差） */
const toYmd=v=>{
  if(typeof v==='number')return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10);
  if(v instanceof Date)return ymd(v);
  const m=typeof v==='string'&&v.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:null;
};
/* 解析二维数组：按表头文字定位列，返回 加班行 / 调休行 / 原表汇总 */
function xlRows(A){
  const hr=A.findIndex(r=>r&&r.includes('加班日期')&&r.includes('调休日期'));
  if(hr<0)throw new Error('没找到表头，需要包含「加班日期」和「调休日期」两列');
  const H=A[hr].map(x=>typeof x==='string'?x.replace(/\s/g,''):x);
  const nm=[];H.forEach((x,i)=>{if(x==='姓名')nm.push(i)});
  if(nm.length<2)throw new Error('表头里需要有两列「姓名」（加班一列、调休一列）');
  const c={on:nm[0],od:H.indexOf('加班日期'),oh:H.indexOf('加班天数'),ln:nm[1],ld:H.indexOf('调休日期'),lh:H.indexOf('调休天数'),lt:H.indexOf('备注情况'),sn:nm[2],sl:H.findIndex(x=>typeof x==='string'&&x.startsWith('未休假'))};
  const ot=[],lv=[],sum={},str=v=>typeof v==='string'&&!v.startsWith('=')?v.trim():'';
  for(const r of A.slice(hr+1)){
    if(!r)continue;
    const on=str(r[c.on]),od=toYmd(r[c.od]),oh=r[c.oh];
    if(on&&od&&typeof oh==='number'&&oh>0){const mk=r[c.oh+1];ot.push({name:on,date:od,days:oh,mark:str(mk),extra:typeof mk==='number'&&mk>0?mk:0})}
    const ln=str(r[c.ln]),lh=r[c.lh];
    if(ln&&typeof lh==='number'&&lh>0)lv.push({name:ln,date:toYmd(r[c.ld]),days:lh,note:c.lt>=0?str(r[c.lt]):''});
    if(c.sn!==undefined&&str(r[c.sn])&&typeof r[c.sl]==='number')sum[str(r[c.sn])]=r[c.sl];
  }
  return{ot,lv,sum};
}
/* 为某个人生成加班单和调休记录（调休按「先进先出」回填到加班单，不检查有效期） */
let _xn=0;
function xlBuild(nm,o,src=_xl,base=[]){
  const w={fee:0,feeDays:0,cap:0,round:0,short:0,skipLv:0},tk=[];
  src.ot.filter(x=>x.name===nm).forEach((x,i)=>{
    if(o.skipFee&&x.mark==='加班费'){w.fee++;w.feeDays+=x.days;return}
    const wd=new Date(x.date+'T00:00:00Z').getUTCDay(),type=x.type||(wd%6===0?'restday':'workday');
    let u=Math.round(x.days*4);if(u<1)return;if(u>4){u=4;w.cap++}
    tk.push({id:uid()+'t'+(_xn++),person:nm,date:x.date,type,u,...(x.keepQ||{coef:S.settings.coef.global*S.settings.coef[type],extraU:Math.round(x.extra*4),quotaU:calcQuota(u,type)+Math.round(x.extra*4)}),usedU:(x.used?(x.keepQ?x.keepQ.quotaU:calcQuota(u,type)+Math.round(x.extra*4)):0),_u:x.used?1:0,remark:x.remark??(x.mark?'原表标记：'+x.mark:(x.extra?'含原表额外额度 '+x.extra+' 天':'')),source:x.src||'excel',waive:!!x.waive,createdAt:Date.now()+i});
  });
  const cm=src.ot.some(x=>x.used!=null),pool=[...base,...tk].sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt),out=[];
  const lvs=src.lv.filter(x=>x.name===nm).map(x=>({...x,date:x.date||today()})).sort((a,b)=>a.date.localeCompare(b.date));
  lvs.forEach((x,i)=>{
    if(!x.keep&&((x.note==='加班费'&&!o.cashout)||(x.note==='逾期作废'&&!o.voided))){w.skipLv++;return}
    const raw=x.days*4;let u=Math.round(raw);if(u<1)return;if(Math.abs(raw-u)>1e-6)w.round++;
    let need=u;const al=[];
    const pick=t=>{if(cm){if(!t._u)return;const a=Math.min(need,t.quotaU-(t._l||0));if(a>0){t._l=(t._l||0)+a;need-=a;al.push({tid:t.id,u:a})}return}const a=Math.min(need,t.quotaU-t.usedU);if(a>0){t.usedU+=a;need-=a;al.push({tid:t.id,u:a})}};
    const ok1=t=>t.date<=x.date&&(t.waive||expiry(t)>=x.date);pool.filter(ok1).forEach(pick);pool.filter(t=>t.date<=x.date&&!ok1(t)).forEach(pick);pool.filter(t=>t.date>x.date).forEach(pick);
    let remark=x.note;
    if(need>0){w.short+=need;u-=need;remark+=(remark?' ':'')+`（原表${x.days}天，额度不足仅扣${u/4}天）`}
    if(u<1)return;
    out.push({id:uid()+'l'+(_xn++),person:nm,date:x.date,u,alloc:al,remark,createdAt:Date.now()+i});
  });
  /* 按原表「汇总-未休假」校准：差额多补一张「手动校准」额度，或扣减一条校准调休（只能到 0.25 天） */
  const sm=src.sum&&src.sum[nm];
  if(o.calib&&typeof sm==='number'){
    const all=[...base,...tk],cur=all.filter(usable).reduce((s,t)=>s+rem(t),0),d=Math.round((Math.round(sm*20)/5-cur)*1e6)/1e6;
    if(Math.abs(sm*20-Math.round(sm*20))>1e-6)w.frac=(w.frac||0)+1;
    if(d>0)tk.push({id:uid()+'c'+(_xn++),person:nm,date:today(),type:'workday',u:0,coef:1,extraU:d,quotaU:d,usedU:0,remark:'按原表汇总校准',source:'adjust',waive:true,createdAt:Date.now()});
    else if(d<0){let need=-d;const al=[];all.filter(usable).sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{const a=Math.min(need,rem(t));if(a>0){t.usedU+=a;need-=a;al.push({tid:t.id,u:a})}});
      out.push({id:uid()+'l'+(_xn++),person:nm,date:today(),u:-d-need,alloc:al,remark:'按原表汇总校准',createdAt:Date.now()})}
  }
  tk.forEach(t=>{delete t._u;delete t._l});return{tk,all:[...base,...tk],lv:out,w};
}
const xlOpts=()=>({skipFee:$('x_f').checked,cashout:$('x_w').checked,voided:$('x_e').checked,replace:$('x_c').checked,calib:$('x_k').checked});
const xlSel=()=>[...document.querySelectorAll('.x_cb:checked')].map(i=>i.value);
function xlAll(v){document.querySelectorAll('.x_cb').forEach(i=>i.checked=v);xlPreview()}
function xlPreview(){
  const names=xlSel(),box=$('x_p'),btn=$('x_b'),o=xlOpts(),sum=a=>a.reduce((s,x)=>s+x,0);
  if(!names.length){box.innerHTML='<span class="sub">请至少选择一位人员</span>';btn.disabled=true;return}
  let nt=0,nl=0,wr=0,ws=0,wf=0;
  const rows=names.map(nm=>{const r=xlBuild(nm,o,xlSrc(nm,o),xlBase(nm,o)),ok=r.all.filter(usable),vb=sum(ok.map(rem)),sn=sum(ok.filter(t=>!t.waive&&daysLeft(t)<=30).map(rem));
    nt+=r.tk.length;nl+=r.lv.length;wr+=r.w.round;ws+=r.w.short;wf+=r.w.frac||0;
    return`<tr><td>${esc(nm)}</td><td>${d1(vb/4)}</td><td>${sn?d1(sn/4):'-'}</td><td>${_xl.sum[nm]!=null?d1(_xl.sum[nm]):'-'}</td></tr>`});
  box.innerHTML=`共 <b>${names.length}</b> 人，导入加班单 <b>${nt}</b> 张，调休 <b>${nl}</b> 条
  <div style="max-height:220px;overflow:auto;margin-top:8px"><table><tr><th>姓名</th><th>有效余额</th><th>即将过期</th><th>原表未休假</th></tr>${rows.join('')}</table></div>
  <div class="lbl" style="margin-top:8px">有效余额按当前过期规则计算（含 E 列额外额度）；与原表的差异主要来自额外额度、已过期单据和被跳过的「加班费」加班。${wr?`<br>${wr} 条时长已就近取整/封顶。`:''}${wf?`<br>${wf} 人的汇总值不是 0.05 天的整数倍，已就近取整。`:''}${ws?`<br>有调休超出加班额度共 ${d1(ws/4)} 天，已按可扣额度记录。`:''}</div>`;
  btn.disabled=false;
}
async function xlPick(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  if(typeof XLSX==='undefined')return alert('Excel 组件未加载，请检查网络');
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});let err;
    window._xl=xlTpl(wb);
    if(!_xl)for(const sn of wb.SheetNames){try{window._xl=xlRows(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null}));break}catch(e){err=e}}
    if(!_xl)throw err;
  }catch(e){return alert('读取失败：'+e.message)}
  xlDialog();
}
function xlDialog(){
  const cnt={};_xl.ot.forEach(x=>cnt[x.name]=(cnt[x.name]||0)+1);_xl.lv.forEach(x=>cnt[x.name]=cnt[x.name]||0);
  const names=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  openM(`<h3>导入 Excel</h3><div class="lbl">勾选要导入的人员，导入后会出现在顶部人员栏（数字为加班记录条数）。${_xl.ot.some(x=>x.used!=null)?'':'<br>网页里读不到原表的字体颜色，将按先进先出扣减；想按已休/未休导入，请用模板的「是否已休」列，导入后也可用「校准余额」调整。'}</div>
  <div class="row" style="margin-top:12px"><button class="g s" onclick="xlAll(true)">全选</button><button class="g s" onclick="xlAll(false)">全不选</button></div>
  <div style="max-height:170px;overflow:auto;margin-top:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0 8px">${names.map(n=>`<label style="margin:7px 0;display:flex;gap:6px;align-items:center;color:var(--tx)"><input type="checkbox" class="x_cb" value="${esc(n)}" checked onchange="xlPreview()" style="width:auto;min-height:0"> ${esc(n)} <span class="lbl">${cnt[n]}</span></label>`).join('')}</div>
  <label><input type="checkbox" id="x_f" checked onchange="xlPreview()" style="width:auto;min-height:0"> 跳过标记「加班费」的加班（已折现，不计入调休额度）</label>
  <label><input type="checkbox" id="x_w" checked onchange="xlPreview()" style="width:auto;min-height:0"> 「加班费」结算行导入为调休记录（扣减额度）</label>
  <label><input type="checkbox" id="x_e" onchange="xlPreview()" style="width:auto;min-height:0"> 「逾期作废」行也导入（一般不需要：过期由本工具按规则自动判断）</label>
  <label><input type="checkbox" id="x_c" ${_xl.tpl?'':'checked'} onchange="xlPreview()" style="width:auto;min-height:0"> 覆盖已有的同名人员数据（不勾选＝追加：保留已有数据，自动跳过重复行）</label>
  <label><input type="checkbox" id="x_k" ${Object.keys(_xl.sum||{}).length?'checked':''} onchange="xlPreview()" style="width:auto;min-height:0"> 按原表「汇总-未休假」校准各人余额（差额记为「手动校准」）</label>
  <div class="card" id="x_p" style="margin:14px 0 0;padding:16px;box-shadow:none;background:#f8f8fa"></div>
  <div class="row" style="margin-top:16px"><button class="b" id="x_b" onclick="xlDo()">导入</button><button class="g" onclick="closeM()">取消</button></div>`);
  xlPreview();
}
function xlDo(){
  const names=xlSel();if(!names.length)return;const o=xlOpts();let nt=0,nl=0;
  const exist=names.filter(n=>S.tickets.some(t=>t.person===n)||S.leaves.some(l=>l.person===n));
  if(o.replace&&exist.length&&!confirm('将覆盖这些人员已有的数据：'+exist.join('、')+'。确定？'))return;
  names.forEach(nm=>{const r=xlBuild(nm,o,xlSrc(nm,o),xlBase(nm,o));if(!r.tk.length&&!r.lv.length)return;
    S.tickets=S.tickets.filter(t=>t.person!==nm);if(o.replace)S.leaves=S.leaves.filter(l=>l.person!==nm);
    S.tickets.push(...r.all);S.leaves.push(...r.lv);if(!S.people.includes(nm))S.people.push(nm);nt+=r.tk.length;nl+=r.lv.length});
  /* 默认占位人员「我」没有任何数据时，导入后自动移除 */
  if(S.people.length>1&&!S.tickets.some(t=>t.person==='我')&&!S.leaves.some(l=>l.person==='我'))S.people=S.people.filter(p=>p!=='我');
  if(names.length===1||!S.people.includes(S.cur))S.cur=names[0];
  save();closeM();tab='ov';render();
  alert(`已导入 ${names.length} 人：${nt} 张加班单、${nl} 条调休记录。\n加班类型按日期推断（周末=休息日，其余=工作日），节假日请在「加班单」里手动编辑。`);
}
if(!localStorage.getItem(KEY))seedApply();
else if(S.seedVer!==SEEDV)setTimeout(()=>{
  if(confirm('内置数据已更新：以最新登记表为准，各人余额已按「汇总-未休假」校准。\n是否用新数据覆盖本机这些人员的数据？（会清除你对他们做过的手动调整，建议先备份 JSON；取消则保持现状）'))seedApply();
  else{S.seedVer=SEEDV;persist()}render()},300);
render();
</script>
